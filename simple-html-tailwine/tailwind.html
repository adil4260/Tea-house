<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea house</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Manrope:wght@200..800&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="open-sans-normal">

    <div class="parent-div flex justify-center items-center border-2 border-red-500 min-h-[200px] container mx-auto">
        <div class="left-div border border-green-500">

            <h1 class="text-[80px] my-10 font-bold">It's good <br> tea time at The <br> Tea House</h1>

            <p class="text-[18px] ">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your
                Taste Buds.
            </p>
            <button class="w-[200px] h-[64px] text-xl text-white bg-red-500 rounded-lg">Explore More</button>
        </div>
        <div class="right-div border-2 border-blue-500">
            <img src="images/banner.png" class="relative top-[120px]" alt="">
            <div class=" w-[255px] h-[100px] flex items-center shadow-md rounded-lg">
                <span class="text-2xl"><i class="fa-solid fa-star"></i></span>
                <div class="">
                    <p class="text-4xl font-bold">5.00</p>
                    <p>Trust Pilot Ratings</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
